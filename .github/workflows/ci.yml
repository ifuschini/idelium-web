name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api-go-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ifuschini/idelium-api-go
          ref: 68d22b2
          path: idelium-api-go
      - name: Validate Go-owned Web smoke targets
        working-directory: idelium-api-go
        run: |
          python3 scripts/build_web_smoke_targets.py --check
          python3 scripts/validate_golden_fixtures.py testdata/golden/laravel-parallel-runs

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.17.0
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run lint:check
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
